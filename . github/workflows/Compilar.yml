name: WiiU
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitpccafe:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar SDL2
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S wiiu-sdl2 wiiu-sdl2_mixer wiiu-sdl2_image --noconfirm
      - name: Compilar
        run: make
      - name: Subir ejecutable Wii U
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDash-WiiU
          path: |
            *.wuhb
            *.rpx
